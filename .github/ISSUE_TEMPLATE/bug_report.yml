name: Bug report
description: Something looks wrong or doesn't work.
labels: [bug]
body:
  - type: dropdown
    id: theme
    attributes:
      label: Theme
      options: [Neon Rooftop, Phosphor Alley, Deep Net, Ripperdoc, Badlands, Blackwall, Corpo Plaza, All of them]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead. A screenshot helps a lot.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Claude Code version
      placeholder: "2.1.325"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Operating system and window size
      placeholder: "Windows 11, 2000x1220, side panel open"
